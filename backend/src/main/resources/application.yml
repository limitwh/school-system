server:
  port: 8080

spring:
  application:
    name: school-system-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/school_system
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update          # 开发期自动建表；生产环境改为 validate/none
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

# JWT 配置
jwt:
  # 生产环境必须通过环境变量注入，不要使用默认值
  secret: ${JWT_SECRET:school-system-jwt-secret-key-change-me-in-production-0123456789}
  expiration: 7200000           # Token 有效期（毫秒）= 2 小时
  header: Authorization
  prefix: "Bearer "

# 密码策略
app:
  password:
    # 管理员按登录名重置用户密码时生成的一次性随机密码长度（最小 8，可用环境变量 PASSWORD_RESET_LENGTH 覆盖）
    reset-length: ${PASSWORD_RESET_LENGTH:10}
    # 一次性随机密码有效期（小时，可用环境变量 PASSWORD_RESET_VALID_HOURS 覆盖）
    reset-valid-hours: ${PASSWORD_RESET_VALID_HOURS:24}
  log:
    archive:
      # 归档文件目录（相对后端工作目录；可用环境变量 LOG_ARCHIVE_DIR 覆盖）
      dir: ${LOG_ARCHIVE_DIR:logs/archive}
      # 日志保留天数：超过该天数的日志归档到文件后从库中删除
      retention-days: ${LOG_RETENTION_DAYS:30}
      # 定时归档时间（默认每天 03:00；可用环境变量 LOG_ARCHIVE_CRON 覆盖）
      cron: "${LOG_ARCHIVE_CRON:0 0 3 * * ?}"

logging:
  level:
    com.school: debug
